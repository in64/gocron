name: 发布 Seiya 标准构建输入

on:
  push:
    tags:
      - v1.11.1-seiya.5
  workflow_dispatch:
    inputs:
      tag:
        description: 必须已存在且精确指向发布提交的 tag
        required: true
        default: v1.11.1-seiya.5

concurrency:
  group: seiya-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: v1.11.1-seiya.5
  GO_VERSION: 1.26.6
  NODE_VERSION: 25.9.0
  PNPM_VERSION: 10.34.3

jobs:
  guard:
    name: 锁定发布提交并执行质量门禁
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      release_commit: ${{ steps.lock.outputs.release_commit }}
    steps:
      - name: 校验精确发布 tag
        env:
          SELECTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: test "$SELECTED_TAG" = "$RELEASE_TAG"
      - name: 检出精确发布 tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: 锁定本次运行的发布 commit
        id: lock
        env:
          EVENT_COMMIT: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          release_commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          [[ "$release_commit" =~ ^[0-9a-f]{40}$ ]]
          test "$tag_commit" = "$release_commit"
          if [ "$EVENT_NAME" = push ]; then
            test "$EVENT_COMMIT" = "$release_commit"
          fi
          printf 'release_commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: 校验发布脚本
        env:
          SEIYA_RELEASE_COMMIT: ${{ steps.lock.outputs.release_commit }}
        run: |
          .github/scripts/test-seiya-release.sh
          .github/scripts/seiya-release.sh verify-identity

  build:
    name: 标准构建与本地校验
    needs: guard
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SEIYA_RELEASE_COMMIT: ${{ needs.guard.outputs.release_commit }}
    steps:
      - name: 检出本次运行锁定的 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.release_commit }}
          fetch-depth: 0
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/gocronx-admin/pnpm-lock.yaml
      - name: 构建双架构制品与 release.json
        run: .github/scripts/seiya-release.sh build dist
      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: seiya-gocron-v1.11.1-seiya.5
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: 发布 sources 并逐字节回读
    needs: [guard, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      SEIYA_RELEASE_COMMIT: ${{ needs.guard.outputs.release_commit }}
    steps:
      - name: 检出本次运行锁定的 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.release_commit }}
          fetch-depth: 0
      - name: 安装 source 枚举使用的 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: 下载构建结果
        uses: actions/download-artifact@v4
        with:
          name: seiya-gocron-v1.11.1-seiya.5
          path: dist/
      - name: 安装固定版本 Fery
        run: .github/scripts/seiya-release.sh install-fery "$GITHUB_WORKSPACE/.git/fery"
      - name: 发布前重验 tag 未移动
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          .github/scripts/seiya-release.sh verify-identity
      - name: 上传 sources payload，回读后最后发布 manifest
        env:
          FERY_SECRET_KEY: ${{ secrets.FERY_SECRET_KEY }}
        run: .github/scripts/seiya-release.sh publish dist "$GITHUB_WORKSPACE/.git/fery"
