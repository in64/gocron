name: 发布 Seiya 标准构建输入

on:
  push:
    tags:
      - v1.11.1-seiya.5
  workflow_dispatch:
    inputs:
      tag:
        description: 必须已存在且精确指向发布提交的 tag
        required: true
        default: v1.11.1-seiya.5

concurrency:
  group: seiya-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: v1.11.1-seiya.5
  GO_VERSION: 1.26.6
  NODE_VERSION: 25.9.0
  PNPM_VERSION: 10.34.3

jobs:
  build:
    name: 标准构建与本地校验
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: 校验精确发布 tag
        env:
          SELECTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: test "$SELECTED_TAG" = "$RELEASE_TAG"
      - name: 检出精确发布 tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/gocronx-admin/pnpm-lock.yaml
      - name: 校验发布脚本
        run: .github/scripts/test-seiya-release.sh
      - name: 构建双架构制品与 release.json
        run: .github/scripts/seiya-release.sh build dist
      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: seiya-gocron-v1.11.1-seiya.5
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: 发布 sources 并逐字节回读
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 校验精确发布 tag
        env:
          SELECTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: test "$SELECTED_TAG" = "$RELEASE_TAG"
      - name: 检出精确发布 tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: 安装 source 枚举使用的 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: 下载构建结果
        uses: actions/download-artifact@v4
        with:
          name: seiya-gocron-v1.11.1-seiya.5
          path: dist/
      - name: 安装固定版本 Fery
        run: .github/scripts/seiya-release.sh install-fery "$GITHUB_WORKSPACE/.git/fery"
      - name: 上传 sources payload，回读后最后发布 manifest
        env:
          FERY_SECRET_KEY: ${{ secrets.FERY_SECRET_KEY }}
        run: .github/scripts/seiya-release.sh publish dist "$GITHUB_WORKSPACE/.git/fery"
