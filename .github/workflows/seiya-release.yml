name: 发布 Seiya Linux 制品

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: seiya-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: 1.26.6
  NODE_VERSION: 25.9.0
  PNPM_VERSION: 10.34.3
  GOPROXY: https://goproxy.cn,direct
  GOTOOLCHAIN: local
  SOURCE_COMMIT: f66716d09cf66510fc3ac58158a62524736afad5
  SERVICE_VERSION: 1.11.1-seiya.2
  FERY_ORIGIN: https://fery.seiya.dev
  FERY_CLI_URL: https://fery.seiya.dev/bin/fery/fery-x86_64-unknown-linux-musl
  FERY_CLI_SHA256: 30ea9f968051414902ef8eb189bc565702f9c2cb13e4ded034ff0f0799664c67

jobs:
  frontend:
    name: 构建管理界面
    runs-on: ubuntu-22.04
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/gocronx-admin/pnpm-lock.yaml
      - name: 构建管理界面
        working-directory: web/gocronx-admin
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: 上传管理界面
        uses: actions/upload-artifact@v4
        with:
          name: gocron-frontend-dist
          path: web/gocronx-admin/dist/

  build:
    name: 构建 ${{ matrix.arch }}
    needs: frontend
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: 下载管理界面
        uses: actions/download-artifact@v4
        with:
          name: gocron-frontend-dist
          path: web/gocronx-admin/dist/
      - name: 构建二进制
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build_date=2026-08-16T10:31:42Z
          ldflags="-s -w -buildid= -X main.AppVersion=1.11.1 -X main.BuildDate=${build_date} -X main.GitCommit=${SOURCE_COMMIT}"
          for service in gocron gocron-node; do
            output="dist/${service}-linux-${{ matrix.arch }}"
            package="./cmd/gocron"
            [ "$service" = gocron-node ] && package="./cmd/node"
            CGO_ENABLED=0 GOOS=linux go build -trimpath -buildvcs=false -ldflags "$ldflags" -o "$output" "$package"
            chmod 755 "$output"
            sha256sum "$output" | tee "$output.sha256"
            file "$output"
          done
      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: gocron-linux-${{ matrix.arch }}
          path: dist/gocron-linux-${{ matrix.arch }}*
      - name: 上传节点二进制
        uses: actions/upload-artifact@v4
        with:
          name: gocron-node-linux-${{ matrix.arch }}
          path: dist/gocron-node-linux-${{ matrix.arch }}*

  publish:
    name: 发布并校验 Fery
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: 检出发布脚本
        uses: actions/checkout@v4
      - name: 验证不可变发布判定
        run: .github/scripts/test-publish-seiya-artifacts.sh
      - name: 下载二进制
        uses: actions/download-artifact@v4
        with:
          pattern: gocron*-linux-*
          path: dist
          merge-multiple: true
      - name: 校验标准制品清单
        run: |
          set -euo pipefail
          expected="$(for service in gocron gocron-node; do
            for arch in amd64 arm64; do
              printf '%s\n' "${service}-linux-${arch}" "${service}-linux-${arch}.sha256"
            done
          done | sort)"
          actual="$(find dist -maxdepth 1 -type f -exec basename {} \; | sort)"
          test "$actual" = "$expected"
          for service in gocron gocron-node; do
            for arch in amd64 arm64; do
              name="${service}-linux-${arch}"
              test "$(awk 'NF {print $1; exit}' "dist/${name}.sha256")" = \
                "$(sha256sum "dist/${name}" | awk '{print $1}')"
            done
          done
      - name: 安装 Fery CLI
        env:
          FERY_SECRET_KEY: ${{ secrets.FERY_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$FERY_SECRET_KEY"
          curl --fail --location --retry 5 --retry-all-errors --output fery "$FERY_CLI_URL"
          echo "$FERY_CLI_SHA256  fery" | sha256sum --check --status
          chmod 755 fery
      - name: 上传并回读校验
        env:
          FERY_SECRET_KEY: ${{ secrets.FERY_SECRET_KEY }}
        run: |
          set -euo pipefail
          args=()
          for service in gocron gocron-node; do
            for arch in amd64 arm64; do
              name="${service}-linux-${arch}"
              args+=("$service" "$SERVICE_VERSION" "dist/$name")
            done
          done
          .github/scripts/publish-seiya-artifacts.sh "${args[@]}"
